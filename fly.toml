# fly.toml app configuration file generated for motion-mcp-server on 2026-03-20T22:18:13+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'motion-mcp-server'
primary_region = 'sin'

[build]
  dockerfile = 'apps/mcp-server/Dockerfile'

[env]
  # Public base URL of this server — used in OAuth discovery metadata (issuer, endpoints).
  MCP_PUBLIC_URL = 'https://motion-mcp-server.fly.dev'
  # Web app (custom domain) that hosts the OAuth consent screen (/agent-consent).
  WEB_APP_URL = 'https://knowledge.kelassekejap.com'
  # Secrets (set via `fly secrets set`): SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, PARTYKIT_HOST

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    path = '/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
